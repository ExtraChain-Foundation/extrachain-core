[workspace]
members = [
    "macros",
    "sdk",
    "components",
    "fungible-token",
    "non-fungible-token",
    "message-claim",
    "examples/token-x",
    "examples/nft-collection",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.97"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
